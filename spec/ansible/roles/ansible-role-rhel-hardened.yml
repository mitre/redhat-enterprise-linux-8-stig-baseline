---
- hosts:
    - localhost
  roles:
    - roles/ansible-role-rhel-vanilla
    - roles/ansible-role-rhel-local-hardening-tasks
    - roles/rhel8STIG-ansible-lockdown
  serial: 50
  become: yes
  vars:
    rhel8stig_bootloader_password_hash: "changethispassword"
    rhel_08_010020: false # FIPS mode can cause Test Kitchen SSH authentication to fail.
    rhel_08_010290: false # SSH MAC crypto policy can cause Test Kitchen SSH authentication to fail.
    rhel_08_010291: false # SSH cipher crypto policy can cause Test Kitchen SSH authentication to fail.
    rhel_08_010293: false # FIPS mode can cause Test Kitchen SSH authentication to fail.
    rhel_08_040123: false # RHEL 8 must mount /tmp with the nodev option.
    rhel_08_040124: false # RHEL 8 must mount /tmp with the nosuid option.
    rhel_08_040125: false # RHEL 8 must mount /tmp with the noexec option.
    rhel_08_040342: false # SSH KEX crypto policy can cause Test Kitchen SSH authentication to fail.
    rhel_08_010380: false # RHEL 8 must require users to provide a password for privilege escalation.
